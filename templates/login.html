{% extends "base.html" %}

{% block title %}Login - Sports AI{% endblock %}

{% block content %}
<div class="flex justify-center items-center min-h-[80vh]">
    <!-- Animated Gradient Background -->
    <div class="fixed inset-0 z-[-1] bg-animated"></div>
    <div class="fixed inset-0 z-[-1] bg-black/60 backdrop-blur-sm"></div>

    <div class="relative w-full max-w-md p-8 glass rounded-3xl border border-glass-border shadow-2xl animate-fade-in-up">
        <div class="absolute -top-12 left-1/2 transform -translate-x-1/2 w-24 h-24 bg-neon-cyan/20 rounded-full blur-3xl animate-pulse"></div>

        <div class="text-center mb-8">
            <h2 class="text-4xl font-black text-white tracking-tighter mb-2">
                BET<span class="text-neon-cyan">AI</span>
            </h2>
            <p class="text-sm text-gray-400 font-medium">ACCESO AL SISTEMA INTELIGENTE</p>
        </div>

        <form action="{{ url_for('login') }}" method="POST" class="space-y-6">
            <div class="group">
                <label for="username" class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 group-focus-within:text-neon-cyan transition-colors">Usuario</label>
                <div class="relative">
                    <i class="fas fa-user absolute left-4 top-3.5 text-gray-500 group-focus-within:text-white transition-colors"></i>
                    <input type="text" id="username" name="username" class="w-full bg-black/50 border border-zinc-700 rounded-xl py-3 pl-12 pr-4 text-white placeholder-zinc-600 focus:outline-none focus:border-neon-cyan focus:ring-1 focus:ring-neon-cyan transition-all" placeholder="admin" required>
                </div>
            </div>

            <div class="group">
                <label for="password" class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 group-focus-within:text-neon-purple transition-colors">Contraseña</label>
                <div class="relative">
                    <i class="fas fa-lock absolute left-4 top-3.5 text-gray-500 group-focus-within:text-white transition-colors"></i>
                    <input type="password" id="password" name="password" class="w-full bg-black/50 border border-zinc-700 rounded-xl py-3 pl-12 pr-4 text-white placeholder-zinc-600 focus:outline-none focus:border-neon-purple focus:ring-1 focus:ring-neon-purple transition-all" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="w-full bg-white text-black font-black py-4 rounded-xl shadow-lg hover:bg-neon-cyan hover:shadow-neon-cyan transition-all transform hover:-translate-y-1 active:scale-95 duration-200 mt-8">
                INICIAR SESIÓN <i class="fas fa-arrow-right ml-2"></i>
            </button>
        </form>

        <div class="mt-8 text-center">
            <a href="#" class="text-xs text-zinc-500 hover:text-white transition-colors">¿Olvidaste tu contraseña?</a>
        </div>
    </div>
</div>

<style>
    @keyframes fade-in-up {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in-up {
        animation: fade-in-up 0.8s ease-out forwards;
    }
</style>
{% endblock %}
